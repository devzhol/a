<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Восстановление пароля</title>
</head>
<body>
    <h1>Восстановление пароля</h1>
    <p>Введите email, на который придёт ссылка для восстановления пароля.</p>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Отправить письмо</button>
    </form>
    <p><a href="{% url 'home' %}">На главную</a></p>
</body>
</html>
